
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Online Store</title>

    <!-- Connecting CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Website Header -->
    <header>
        <h1>ShopEasy</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#products">Products</a>
            <a href="#cart">Cart 🛒 (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <!-- Main Heading -->
    <section class="hero">
        <h2>Welcome to ShopEasy</h2>
        <p>Find your favourite products at the best prices!</p>
    </section>

    <!-- Products Section -->
    <section id="products">

        <h2>Our Products</h2>
        <input type="text" id="searchInput" placeholder="Search products...">
        <h2>Our Products</h2>

<input type="text" id="searchInput" placeholder="Search products...">

<select id="categoryFilter">
    <option value="all">All Products</option>
    <option value="electronics">Electronics</option>
    <option value="accessories">Accessories</option>
    <option value="grocery">Grocery</option>
    <option value="clothing">Clothing</option>
    <option value="beauty">Beauty & Personal Care</option>
    <option value="home">Home & Kitchen</option>
    <option value="stationery">Stationery</option>
</select>
<select id="sortPrice">
    <option value="default">Sort by Price</option>
    <option value="low-high">Price: Low to High</option>
    <option value="high-low">Price: High to Low</option>
</select>
<div class="product-container">

        <div class="product-container">
            
</select>

            <!-- Product 1 -->
            <div class="product-card">

                <img
                    src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500"
                    alt="Smartphone">

                <h3>Smartphone</h3>

                <p>Price: ₹15,000</p>

                <button class="add-btn"
                    data-name="Smartphone"
                    data-price=" 15000 ">
                    Add to Cart
                </button>

            </div>

            <!-- Product 2 -->
            <div class="product-card">

                <img
                    src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500"
                    alt="Laptop">

                <h3>Laptop</h3>

                <p>Price: ₹45,000</p>

                <button class="add-btn"
                    data-name="Laptop"
                    data-price="45000">
                    Add to Cart
                </button>

            </div>

            <!-- Product 3 -->
            <div class="product-card">

                <img
                    src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
                    alt="Headphones">

                <h3>Headphones</h3>

                <p>Price: ₹2,000</p>

                <button class="add-btn"
                    data-name="Headphones"
                    data-price="2000">
                    Add to Cart
                </button>

            </div>

        </div>
    </section>
    <!-- Wishlist Section -->
<section id="wishlist">
    <h2>My Wishlist ❤️</h2>
    <ul id="wishlist-items"></ul>
</section>

    <!-- Shopping Cart Section -->
    <section id="cart">

        <h2>My Shopping Cart</h2>

       <ul id="cart-items"></ul>

<h3>Total: ₹<span id="cart-total">0</span></h3>

<button id="clear-cart">Empty Cart</button>

    </section>

    <!-- Connecting JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
